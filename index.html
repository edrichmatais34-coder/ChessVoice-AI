<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessVoice AI</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px 15px;
}
.app {
  max-width:420px;
  margin:35px auto;
  padding:25px;
  background:#1e293b;
  border-radius:18px;
}
h1 {color:#60a5fa;}
#status {color:#4ade80;}
#heard {
  background:#334155;
  padding:18px;
  border-radius:10px;
  min-height:25px;
}
button {
  background:#2563eb;
  color:white;
  border:0;
  padding:14px 22px;
  border-radius:10px;
  font-size:16px;
}
</style>
</head>
<body>
<div class="app">
  <h1>♟ ChessVoice AI</h1>
  <p>Your voice-powered chess assistant</p>
  <h3 id="status">Starting...</h3>
  <p>Recognized speech:</p>
  <div id="heard">Waiting for your move...</div>
  <p id="reply"></p>
  <button onclick="startListening()">Restart Listening</button>
</div>

<script>
const statusText = document.getElementById("status");
const heard = document.getElementById("heard");
const reply = document.getElementById("reply");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;
let listening = false;

function speak(message) {
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(message);
  speechSynthesis.speak(voice);
}

function startListening() {
  if (!SpeechRecognition) {
    statusText.textContent = "Speech recognition unavailable";
    speak("Your browser does not support speech recognition.");
    return;
  }

  if (listening) return;

  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    statusText.textContent = "🎙 Listening...";
  };

  recognition.onresult = (event) => {
    const text = event.results[
      event.results.length - 1
    ][0].transcript;

    heard.textContent = text;
    reply.textContent = "Move received. Chess analysis will be added next.";
    speak("I heard " + text);
  };

  recognition.onerror = () => {
    listening = false;
    statusText.textContent = "Listening stopped. Restart if needed.";
  };

  recognition.onend = () => {
  listening = false;
  statusText.textContent = "Restarting listening...";

  setTimeout(() => {
    startListening();
  }, 1000);
};

  try {
    recognition.start();
  } catch (error) {
    statusText.textContent = "Could not start listening.";
  }
}

window.onload = () => {
  startListening();
};
</script>
</body>
</html>
