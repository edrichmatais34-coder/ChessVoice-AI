
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessVoice AI</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    .app {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 18px;
    }
    h1 { color: #60a5fa; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>♟ ChessVoice AI</h1>
    <p>Your voice-powered chess assistant</p>
    <p id="status">Ready to begin</p>
    <button onclick="speak()">Test Voice</button>
  </div>

  <script>
    function speak() {
      const message = "Welcome to ChessVoice AI";
      const voice = new SpeechSynthesisUtterance(message);
      speechSynthesis.speak(voice);
      document.getElementById("status").textContent =
        "Speaking...";
    }
  </script>
</body>
</html>
